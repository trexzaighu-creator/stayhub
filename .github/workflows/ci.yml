name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        working-directory: ./frontend_next
        run: npm ci
      - name: Build frontend
        working-directory: ./frontend_next
        run: npm run build

  build-backend:
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        working-directory: ./backend_django
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run migrations (no DB service available in CI)
        working-directory: ./backend_django
        run: |
          echo "Skipping migrations in CI; ensure migrations run in deployment"

  build-docker:
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to registry
        if: secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Docker images
        run: |
          docker build -f Dockerfile -t ${{ secrets.DOCKER_IMAGE_NAME || 'hostel-app:latest' }} .

  smoke-test:
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Compose
        uses: docker/setup-buildx-action@v2
      - name: Start services with docker-compose
        run: |
          docker-compose -f docker-compose.yml up -d --build
          sleep 10
      - name: Wait for services and test endpoints
        run: |
          echo "Checking frontend..."
          for i in {1..12}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || echo "000")
            echo "Frontend status: $status"
            if [ "$status" = "200" ]; then break; fi
            sleep 5
          done
          echo "Checking API..."
          for i in {1..12}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/ || echo "000")
            echo "API status: $status"
            if [ "$status" = "200" ]; then break; fi
            sleep 5
          done
          if [ "$status" != "200" ]; then
            docker-compose logs --no-color > ci-docker-logs.txt || true
            cat ci-docker-logs.txt
            exit 1
          fi
      - name: Tear down
        if: always()
        run: |
          docker-compose -f docker-compose.yml down --volumes
