name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend
        working-directory: ./frontend_next
        run: |
          npm ci
          npm run build

      - name: Install backend deps
        working-directory: ./backend_django
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Archive artifacts
        run: |
          tar -czf deploy_payload.tar.gz frontend_next/.next frontend_next/package.json backend_django backend_django/requirements.txt deploy

      - name: Copy to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          source: "deploy_payload.tar.gz"
          target: ${{ secrets.DEPLOY_PATH || '/tmp' }}

      - name: Remote deploy commands
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            set -e
            mkdir -p /opt/hostel
            tar -xzf ${{ secrets.DEPLOY_PATH || '/tmp' }}/deploy_payload.tar.gz -C /opt/hostel
            cd /opt/hostel/backend_django
            python -m pip install -r requirements.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            systemctl daemon-reload || true
            systemctl restart backend.service || systemctl start backend.service
            cd /opt/hostel/frontend_next
            npm ci --production
            npm run start &
            systemctl restart frontend.service || systemctl start frontend.service
