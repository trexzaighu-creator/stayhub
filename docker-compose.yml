version: '3.8'
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: hosthel_user
      POSTGRES_PASSWORD: hosthel_pass
      POSTGRES_DB: hosteldb
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped

  web:
    build: ./backend_django
    command: gunicorn backend_django.wsgi:application -w 2 -b 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: 'dev-secret-key'
      DEBUG: '1'
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: hosteldb
      DB_USER: hosthel_user
      DB_PASSWORD: hosthel_pass
      DB_HOST: db
      DB_PORT: '5432'
    depends_on:
      - db
      - redis
    volumes:
      - ./backend_django:/app
      - ./backend_django/uploads:/app/uploads

volumes:
  db_data:
